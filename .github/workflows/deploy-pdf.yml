name: Deploy pdf Worker

on:
  push:
    branches: [main]
    paths:
      - "tools/pdf/**"
      - "packages/seo/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-pdf.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tools/pdf run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c096196e65fdfad4df08bbbda76374b0
